name: PR / rust

# rust build-check + core tests, gated to PRs that actually touch rust (native paths filter,
# no third-party action). the tauri crate tree is slow to compile, so UI-only PRs skip this
# job entirely. runs a two-OS matrix: from the macOS port on, WSL code is compiled out on
# macos, so a mac-side change could otherwise silently break the windows build. cargo test
# runs on BOTH hosts on purpose - it's what exercises each platform's arms from the other
# machine (the macOS launch arms on windows, the WSL arms on macos).
on:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/pr-rust.yml"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # build the frontend first: tauri's build.rs needs ../dist to exist for cargo check.
      - name: Build frontend (vite + tsc)
        run: bun run build

      - name: Check rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # jump-core's test suite gates nowhere else; this is its only CI runner.
      - name: Test jump-core
        run: cargo test --manifest-path src-tauri/Cargo.toml -p jump-core
