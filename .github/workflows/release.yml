name: Release candidate

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Exact package.json version to verify
        type: string
        required: true
      stage_draft:
        description: Stage both verified installers into a new or empty draft
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jump-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Check deliberate version and immutable release state
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: python3 scripts/release.py preflight --sha "$GITHUB_SHA" --confirm-version "$CONFIRM_VERSION"

  macos:
    needs: prepare
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Import the existing authorized signing identity
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: sh scripts/prepare-signing.sh
      - name: Sign, notarize, and verify the final native package
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 scripts/release_macos.py build --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/macos"
      - name: Remove the temporary signing identity
        if: always()
        run: sh scripts/cleanup-signing.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos
          path: ${{ runner.temp }}/macos/
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the unsigned NSIS installer
        run: bun run tauri build --bundles nsis
      - name: Record the exact Windows installer
        run: python scripts/release.py record-windows --sha "$GITHUB_SHA" --artifacts "$RUNNER_TEMP/windows"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows
          path: ${{ runner.temp }}/windows/
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-artifacts
          pattern: '*'
      - name: Check the exact artifact set and verification evidence
        run: python3 scripts/release.py verify-artifacts --sha "$GITHUB_SHA" --artifacts release-artifacts

  stage:
    needs: [prepare, macos, windows, verify]
    if: inputs.stage_draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-artifacts
          pattern: '*'
      - name: Recheck state and stage both installers without replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py stage --sha "$GITHUB_SHA" --artifacts release-artifacts
