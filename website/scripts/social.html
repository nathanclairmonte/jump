<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jump social image</title>
    <style>
      @font-face {
        font-family: "Geist Variable";
        font-weight: 100 900;
        src: url("{{FONT}}") format("woff2");
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #141210;
        color: #f6f2ec;
        font-family: "Geist Variable", sans-serif;
      }
      .canvas {
        height: 100%;
        display: grid;
        grid-template-columns: 430px minmax(0, 1fr);
        gap: 38px;
        align-items: center;
        padding: 64px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand img {
        width: 68px;
        height: 68px;
      }
      h1 {
        font-size: 76px;
        line-height: 1.05;
        font-weight: 650;
        letter-spacing: -2.2px;
        margin: 0;
      }
      .lead {
        max-width: 390px;
        margin: 30px 0 16px;
        font-size: 29px;
        line-height: 1.4;
        letter-spacing: -0.5px;
      }
      .description {
        max-width: 360px;
        margin: 0;
        color: #b3aaa0;
        font-size: 18px;
        line-height: 1.6;
      }
      .shortcut {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 28px;
        color: #b3aaa0;
        font-size: 13px;
      }
      .shortcut span {
        margin-right: 4px;
      }
      kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 32px;
        min-width: 38px;
        padding: 0 9px;
        border: 1px solid #5b5147;
        border-bottom: 2px solid #64574b;
        border-radius: 6px;
        background: #302923;
        color: #e7e0d8;
        font:
          400 12px ui-monospace,
          monospace;
      }
      .space-key {
        min-width: 86px;
      }
      .capture {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 18px 20px #0005);
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div>
        <div class="brand">
          <img src="{{ICON}}" alt="" />
          <h1>Jump</h1>
        </div>
        <p class="lead">Open projects in VS Code, Cursor, or Zed.</p>
        <p class="description">
          Type a project name and press Enter. Jump finds projects in your
          folders, including WSL.
        </p>
        <div class="shortcut">
          <span>Open Jump with</span><kbd>Ctrl</kbd><kbd>Alt</kbd
          ><kbd class="space-key">Space</kbd>
        </div>
      </div>
      <img
        class="capture"
        src="{{LAUNCHER}}"
        width="1200"
        height="876"
        alt="Jump showing pinned projects and recently opened projects"
      />
    </div>
  </body>
</html>
